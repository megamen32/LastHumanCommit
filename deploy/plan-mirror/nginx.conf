# LHC static plan publishing; mutable URLs are deliberately not cached.
server {
    listen 80;
    listen [::]:80;
    server_name lhc.bezrabotnyi.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://lhc.bezrabotnyi.com$request_uri; }
}

server {
    listen 127.0.0.1:8444 ssl;
    server_name lhc.bezrabotnyi.com;
    ssl_certificate /etc/letsencrypt/live/lhc.bezrabotnyi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lhc.bezrabotnyi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/lhc;
    index index.html;
    absolute_redirect off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    location ^~ /v1/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8769;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location ^~ /dashboard/ {
        access_log off;
        proxy_pass http://127.0.0.1:8769;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
