[pytest]
testpaths = tests
# No `-m` filter here on purpose: a filter in addopts would win over a
# `-m nightly` on the command line and the nightly run would deselect
# everything. The default run stays the full, honest suite; the two modes are
# selected with `-m "not nightly"` (fast) and `-m nightly` (long).
markers =
    nightly: long-running integration test. Marked when the measured duration
        of the case is at or above 0.5 s in `pytest tests -q --durations=0`
        because the case drives an external process (CLI subprocess, git
        operation or a live reviewer chain) instead of an in-process
        assertion. The default run executes everything so the suite stays
        honest; the fast-only and nightly-only runs are selected with
        `-m "not nightly"` and `-m nightly`.
