name: LHC landing — GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current LHC source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version is exactly one step above main
        if: github.event_name == 'pull_request'
        run: python3 src/common/tools/lhc_version.py check --target origin/main
      - name: Repeated versions agree with VERSION
        run: python3 scripts/sync_version.py --check
      - name: Validate the generator
        run: python3 -m unittest discover -s site -p 'test_*.py' -v
      - name: Generate the live-source site
        run: python3 site/build.py
      - name: Upload Pages package
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
