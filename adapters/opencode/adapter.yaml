schema_version: 1
harness: opencode
kind: native-plugin
role_source: ../../src/common/agents
optional_instructions: instructions.md
subagent_instructions_template: templates/subagent.md
plugin: ../../plugins/last-human-commit/opencode
delivery: native-markdown-agent-profile
self_improve: event-triggered-core-protocol
capabilities:
  native_role_profile: proven
  fresh_child_context: proven
  model_override: adapter-dependent
  resume_transport: adapter-dependent
  nonblocking_parent_transport: adapter-dependent
  lifecycle_time_guard_hook: proven
  # proven by a real run, not by the branch alone: the plugin now forwards
  # tool args as tool_input, and the hook binary started the OpenCode way
  # (--event PostToolUse --heartbeat-only --runtime opencode) rebuilds the
  # plan from a written leaf with exit 0.  Guards:
  # tests/test_last_spawns.py::test_the_opencode_plugin_puts_the_written_paths_into_the_payload,
  # test_an_opencode_event_rebuilds_the_plan_of_the_written_leaf,
  # test_the_old_opencode_payload_without_tool_input_changes_nothing.
