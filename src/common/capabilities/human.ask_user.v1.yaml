schema_version: 1
id: human.ask_user.v1
state: planned
requirement: required
purpose: Request a blocking human decision without exposing delivery mechanics to the agent.
agent_interface:
  name: AskHuman
  inputs: [question, urgency, blocking]
  outputs: [request_id, state]
invariants:
  - The agent does not choose phone, messenger, timing, or delivery route.
  - One authorized response resolves only its correlated request_id.
  - A resolved request cannot escalate again.
rendering: Render only when an exact Fleet or harness attestation is proven.
