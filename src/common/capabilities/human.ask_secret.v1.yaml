schema_version: 1
id: human.ask_secret.v1
state: available
requirement: required
provider: AskSecret
transport: streamable_http
endpoint: https://pswd.bezrabotnyi.com/mcp
purpose: Obtain a named secret through a registered-agent SSS handoff without exposing plaintext to the agent.
agent_interface:
  name: Ask Secret
  inputs: [secret_name, purpose, consumer, urgency, blocking]
  outputs: [request_id, state, opaque_handle]
invariants:
  - Opaque handle is never secret plaintext.
  - Secret plaintext never enters prompt, tool output, task record, argv, or environment.
  - The accepted path is a registered-agent SSS request that returns only an opaque handle.
  - Plaintext and base64 fallback delivery are rejected for LLM-facing Ask Secret flows.
  - The agent does not choose secret storage, delivery, notification, or resume implementation.
rendering: Render only when the AskSecret HTTP MCP is registered and tools/list attests ask_secret and ask_secret_run.
